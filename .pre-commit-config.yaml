# pre-commit hooks for LightHouse Enterprise.
#
#   uv tool install pre-commit   # or: pipx install pre-commit
#   pre-commit install
#
# Every hook repository is pinned to a full commit SHA (`# frozen: <tag>` records the
# tag it was verified against with `git ls-remote`). A tag can be moved; a SHA cannot.
# Update with `pre-commit autoupdate --freeze`, then review the diff.
#
# The vendored skills (.claude/skills/) and vendored licence texts (third_party/) are
# excluded from the hooks that rewrite files, so they stay byte-identical to upstream.
# They are NOT excluded from the security hooks (gitleaks, detect-private-key,
# check-added-large-files).

minimum_pre_commit_version: "3.2.0"

repos:
  # Secret scanning of staged changes. Reads ./.gitleaks.toml automatically.
  # Builds gitleaks from source with Go (pre-commit installs a Go toolchain if needed).
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      # Security hooks: run on every path, vendored files included.
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      # Hygiene hooks that rewrite or judge file contents: skip vendored material.
      - id: end-of-file-fixer
        exclude: ^(\.claude/skills|third_party)/
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^(\.claude/skills|third_party)/
      - id: check-yaml
        exclude: ^(\.claude/skills|third_party)/
      - id: check-toml
        exclude: ^(\.claude/skills|third_party)/

  # Ruff for the server only. Keep this rev on the same ruff version as server/uv.lock,
  # otherwise the hook and CI (`uv run ruff`) can disagree about formatting.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f368fb366ff7f2f808dd324b83a6d32267799e19 # frozen: v0.17.2
    hooks:
      - id: ruff-check
        files: ^server/
      - id: ruff-format
        files: ^server/
        types_or: [python, pyi]
