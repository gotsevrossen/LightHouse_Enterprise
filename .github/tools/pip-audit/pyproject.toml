# Pinned, hash-locked install of pip-audit for the CI `deps` job.
#
# Why a separate project instead of `uvx pip-audit`: `uvx` would pin pip-audit
# itself but let every transitive dependency float to whatever PyPI serves on the
# day. Locking it here means CI installs exactly the hashes in uv.lock
# (`uv sync --frozen`), and Dependabot proposes updates as reviewable PRs.
[project]
name = "lighthouse-ci-pip-audit"
version = "0"
requires-python = ">=3.12"
dependencies = ["pip-audit==2.10.1"]

[tool.uv]
# Not a package: nothing here is built or installed except its dependencies.
package = false
