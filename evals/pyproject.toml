[project]
name = "lh-evals"
version = "0.1.0"
description = "LightHouse Enterprise triage eval set and harness."
requires-python = ">=3.12"
# The harness runs the server's own triage code (TriageInput, run_triage, the Claude
# triage model built from Settings), never a copy, so a score always describes what the
# server would do. Pydantic is listed because the harness uses it directly.
dependencies = [
    "lighthouse",
    "pydantic>=2.14.3",
]

[project.scripts]
lh-eval = "lh_evals.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
# Editable path dependency: the eval always exercises the working tree's server code.
lighthouse = { path = "../server", editable = true }

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff==0.17.2",
]

# Same lint and type-check settings as server/pyproject.toml.
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # docstrings: comments explain why where it matters
    "CPY",     # no per-file copyright headers in this repo
    "COM812",  # conflicts with the formatter
    "ISC001",  # conflicts with the formatter
    "TC001",   # runtime imports are needed by Pydantic annotations
    "TC002",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert is how pytest checks
    "PLR2004", # literal values are the point of a test
    "S105",    # test-only placeholder strings, not secrets
    "S106",
    "INP001",
    "ANN401",
    "PLR0913",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
# Neither package ships a py.typed marker, so pyright would treat the installed (editable)
# copies as untyped libraries. Resolve both from source; strict checking is unchanged.
executionEnvironments = [{ root = ".", extraPaths = ["src", "../server/src"] }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers"]
filterwarnings = ["error"]
