[project]
name = "lighthouse"
version = "0.1.0"
description = "LightHouse Enterprise control plane: API, connectors, triage and agent gateway."
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.162.4",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.32.0",
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # docstrings: comments explain why where it matters
    "CPY",     # no per-file copyright headers in this repo
    "COM812",  # conflicts with the formatter
    "ISC001",  # conflicts with the formatter
    "TC001",   # runtime imports are needed by FastAPI/Pydantic annotations
    "TC002",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert is how pytest checks
    "PLR2004", # literal values are the point of a test
    "S105",    # test-only placeholder strings, not secrets
    "S106",
    "S603",    # tests start a local postgres with fixed argument lists
    "S607",
    "INP001",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be called in defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Security"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
executionEnvironments = [{ root = "." }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers"]
filterwarnings = ["error"]
